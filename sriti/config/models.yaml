    supports_streaming: true
    supports_system_message: true
    supports_tool_use: true
    supports_parallel_tool_calls: true
    supports_json_mode: true
    supports_vision: true
    supports_thinking: true
    cache_write_cost_per_1m: null
    cache_read_cost_per_1m: null
    typical_latency_class: fast
    strengths: [reasoning, multilingual]
    status: preview

  # Current tier-1 pick using a GOOGLE_API_KEY. gemini-3.6-flash is the
  # recommended starting point — confirm the latest available model with
  # your API key before deploying. Tier-1 vendor is not locked in; swap
  # this entry and set the other tier-1 entries to active as needed.
  gemini/gemini-3.6-flash:
    provider: gemini
    display_name: "Gemini 3.6 Flash — provisional tier-1 pick"
    context_window: 1048576
    max_output_tokens: 65536
    cost_per_1m_input: 0.75
    cost_per_1m_output: 3.75
    default_tier: 1
    supports_streaming: true
    supports_system_message: true
    supports_tool_use: true
    supports_parallel_tool_calls: true
    supports_json_mode: true
    supports_vision: true
    supports_thinking: true
    cache_write_cost_per_1m: null
